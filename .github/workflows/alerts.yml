name: Deploy alerts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/alerts.yml'
      - '.nais/team-sas-alerts-slack.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-prod:
    name: Deploy til prod
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@b34afa2e28c72e92d6c3ef2f9607f982b0a8283f # v1.0.14
    with:
      manifest: .nais/team-sas-alerts-slack.yaml
      environment: prod-gcp
    permissions:
      contents: read
      id-token: write # for nais login
