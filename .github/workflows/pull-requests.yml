name: Bygg pull request

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21.x'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-disabled: true
    - name: test and build
      run: ./gradlew clean build --no-build-cache --no-daemon -Dkotlin.incremental=false -x :jobs:build -x :sykepenger-api:build -x :sykepenger-opprydding-dev:build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
