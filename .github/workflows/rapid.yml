name: Aiven config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rapid.yml'
      - '.nais/rapid.v1.yaml'
      - '.nais/rapid.v1.*.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-dev:
    name: Deploy til dev
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@77c349d62b631cf0fedc02278c68abd33bc8ea5b # v1.0.10
    with:
      manifest: .nais/rapid.v1.yaml
      environment: dev-gcp
    permissions:
      contents: read
      id-token: write # for nais login

  deploy-prod:
    name: Deploy til prod
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@77c349d62b631cf0fedc02278c68abd33bc8ea5b # v1.0.10
    with:
      manifest: .nais/rapid.v1.yaml
      environment: prod-gcp
    permissions:
      contents: read
      id-token: write # for nais login
