metadata:
  name: helse-spleis
spec:
  startup:
    path: isready
    initialDelay: 20
    periodSeconds: 5
    failureThreshold: 9
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 50m
      memory: 512Mi
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        databases:
          - name: spleis
            envVarPrefix: DATABASE
            users:
              - name: spleis-api
              - name: spleis-opprydding-dev
              - name: spleis-avstemming
              - name: spleis-migrate
  env:
    - name: KAFKA_RESET_POLICY
      value: EARLIEST
    - name: IDENTBYTTE
      value: "true"
    - name: SEND_FERIEPENGEOPPDRAG
      value: "true"
    - name: JORDBRUKER
      value: "true"
    - name: GRADERTE_ANDRE_YTELSER
      value: "true"
    - name: JAVA_TOOL_OPTIONS
      value: -agentpath:/opt/cprof/profiler_java_agent.so=-cprof_service=spleis,-cprof_project_id=tbd-dev-7ff9,-logtostderr,-minloglevel=1
