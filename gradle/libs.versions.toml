syfokafka = "2026.05.13-10.24-d6649054"
json-schema-validator = "3.0.7"
commons-codec = "1.22.1"
testcontainers = "2.0.5"

[libraries]
rapids-and-rivers = { group = "com.github.navikt", name = "rapids-and-rivers", version.ref = "rapids-and-rivers" }

jackson-kotlin = { group = "tools.jackson.module", name = "jackson-module-kotlin" }
