logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
logstash = { group = "net.logstash.logback", name = "logstash-logback-encoder", version.ref = "logstash" }

postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgres" }
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }
tbd-sql = { group = "com.github.navikt.tbd-libs", name = "sql-dsl", version.ref = "tbd-libs" }
tbd-kafka = { group = "com.github.navikt.tbd-libs", name = "kafka", version.ref = "tbd-libs" }
tbd-naisful-app = { group = "com.github.navikt.tbd-libs", name = "naisful-app", version.ref = "tbd-libs" }
tbd-naisful-postgres = { group = "com.github.navikt.tbd-libs", name = "naisful-postgres", version.ref = "tbd-libs" }
tbd-azure-token-client-default = { group = "com.github.navikt.tbd-libs", name = "azure-token-client-default", version.ref = "tbd-libs" }
tbd-retry = { group = "com.github.navikt.tbd-libs", name = "retry", version.ref = "tbd-libs" }
tbd-speed-client = { group = "com.github.navikt.tbd-libs", name = "speed-client", version.ref = "tbd-libs" }
