rapids-and-rivers = "2026091610031789545782"
postgres = "42.7.13"
hikari = "7.1.0"
cloudsql = "1.30.0"
flyway = "13.8.0"
logback = "1.6.4"
logstash = "9.0"
tbd-libs = "20261002.1227"
junit-jupiter = "6.1.3"
kotlinx-coroutines = "1.11.0"
awaitility = "4.3.0"
mockk = "1.14.11"
wiremock = "3.13.2"
jsonassert = "1.5.3"
