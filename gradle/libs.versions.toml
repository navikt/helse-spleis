spekemat-fabrikk = { group = "com.github.navikt.spekemat", name = "fabrikk", version.ref = "spekemat" }
spill-av-im-matching = { group = "com.github.navikt.spill_av_im", name = "matching", version.ref = "spill-av-im-matching" }
syfokafka = { group = "no.nav.helse.flex", name = "sykepengesoknad-kafka", version.ref = "syfokafka" }
json-schema-validator = { group = "com.networknt", name = "json-schema-validator", version.ref = "json-schema-validator" }
commons-codec = { group = "commons-codec", name = "commons-codec", version.ref = "commons-codec" }

junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }

[bundles]
flyway = ["flyway-postgres"]
database = ["postgresql", "hikari", "tbd-sql"]
jackson = ["jackson-kotlin"]
logging = ["logback", "logstash"]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
sykepenger-kotlin = { id = "no.nav.sykepenger.kotlin", version.ref = "sykepengerGradlePlugins" }
sykepenger-root = { id = "no.nav.sykepenger.root", version.ref = "sykepengerGradlePlugins" }
