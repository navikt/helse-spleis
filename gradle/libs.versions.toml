tbd-mock-http-client = { group = "com.github.navikt.tbd-libs", name = "mock-http-client", version.ref = "tbd-libs" }
tbd-signed-jwt-issuer-test = { group = "com.github.navikt.tbd-libs", name = "signed-jwt-issuer-test", version.ref = "tbd-libs" }
tbd-rapids-and-rivers-test = { group = "com.github.navikt.tbd-libs", name = "rapids-and-rivers-test", version.ref = "tbd-libs" }

cloudsql = { group = "com.google.cloud.sql", name = "postgres-socket-factory", version.ref = "cloudsql" }
flyway-postgres = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgres = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

ktor-serialization-jackson3 = { group = "io.ktor", name = "ktor-serialization-jackson3" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio" }
ktor-server-auth-jwt = { group = "io.ktor", name = "ktor-server-auth-jwt" }

awaitility = { group = "org.awaitility", name = "awaitility", version.ref = "awaitility" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
wiremock = { group = "org.wiremock", name = "wiremock-jetty12", version.ref = "wiremock" }
